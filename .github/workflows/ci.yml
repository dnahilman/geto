name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]
  workflow_dispatch:

jobs:
  test:
    name: Unit Tests & Typechecks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Install JS/TS dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck web SPA
        run: bun run --filter @geto/web check

      - name: Test editor package
        run: bun test packages/geto-editor

      - name: Build web SPA
        run: bun run --filter @geto/web build

      - name: Test core Rust library (50 mock unit tests)
        run: cargo test -p geto-core

      - name: Check Rust server
        run: cargo check -p geto-server
