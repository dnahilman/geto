[package]
name = "geto-server"
version = "0.5.0"
edition = "2021"

[dependencies]
geto-core = { path = "../../crates/geto-core", features = ["axum"] }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "tls-rustls", "chrono", "uuid", "json", "rust_decimal"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
hex = "0.4"

[dev-dependencies]
reqwest = { version = "0.12", features = ["json", "cookies"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
