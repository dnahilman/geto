[package]
name = "geto-core"
version = "0.4.0"
edition = "2021"

[features]
default = []
axum = ["dep:axum"]

[dependencies]
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "mysql", "postgres", "tls-rustls", "chrono", "uuid", "json", "rust_decimal"] }
utoipa = { version = "5", features = ["chrono", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rust_decimal = "1"
aes-gcm = "0.10"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"
rand = "0.8"
subtle = "2.6"
thiserror = "2.0"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
hex = "0.4"
async-trait = "0.1"
indexmap = { version = "2", features = ["serde"] }
tracing = "0.1"
dotenvy = "0.15"
axum = { version = "0.8", optional = true }

[dev-dependencies]
tempfile = "3"

